<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 页面不存在 | SILENTFORGE DEV STATION</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/icon.png" type="image/png">
<link rel="stylesheet" href="/css/style.css">
<style>
  .err {
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px 20px;
  }
  .err-code {
    font-family: var(--font-mono);
    font-size: clamp(72px, 20vw, 180px);
    font-weight: 800;
    line-height: 1;
    color: transparent;
    background: linear-gradient(180deg, var(--accent), transparent 85%);
    -webkit-background-clip: text;
    background-clip: text;
    letter-spacing: -.02em;
  }
  .err h1 { font-size: clamp(20px, 3.4vw, 30px); margin: 18px 0 12px; }
  .err p { color: var(--text-dim); max-width: 46ch; margin-inline: auto; }
  .err-actions { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .err-tip {
    margin-top: 34px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
  }
</style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-scrim"></div>
    <div class="bg-grid"></div>
    <div class="bg-scan"></div>
  </div>

  <main class="err">
    <div>
      <div class="err-code">404</div>
      <h1>这条支线没写出来</h1>
      <p>你要找的页面不存在，或者已经被移动到别的地方了。<br>回主站继续逛吧。</p>
      <div class="err-actions">
        <a class="btn btn-primary" href="/"><span>返回首页</span></a>
        <a class="btn btn-ghost" href="/#games">游戏下载</a>
      </div>
      <p class="err-tip">SILENTFORGE DEV STATION</p>
    </div>
  </main>

  <script>
    // 跟随主站记住的主题
    try {
      var raw = localStorage.getItem('sf.settings.v1');
      if (raw) {
        var s = JSON.parse(raw);
        var t = s.theme;
        if (t === 'auto' || !t) {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
        if (s.cursor !== false) document.documentElement.setAttribute('data-cursor', '1');
      }
    } catch (e) {}
  </script>
</body>
</html>
